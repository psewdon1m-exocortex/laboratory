<!doctype html>
<html lang="en" class="journal-root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journal — Laboratory</title>
    <!-- seo:head -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/scripts/theme-init.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <noscript><link rel="stylesheet" href="/noscript.css" /></noscript>
  </head>
  <body class="journal-page page-loading">
    <div class="page-transition-overlay" data-transition-overlay aria-hidden="true"></div>
    <div class="topbar journal-topbar">
      <a class="home-link dynamic-text" data-site-title href="/"></a>
      <div class="topbar-right">
        <div class="clock-label dynamic-text" data-clock></div>
        <button class="theme-toggle dynamic-text" type="button" data-theme-toggle aria-label="Change color theme"></button>
      </div>
    </div>

    <main class="journal-shell" data-journal-shell>
      <header class="journal-heading">
        <h1 class="journal-title dynamic-text" data-journal-title></h1>
        <div class="journal-controls dynamic-text">
          <label class="journal-search">
            <span class="sr-only">Search articles by title</span>
            <input type="search" data-journal-search placeholder="Search by title" autocomplete="off" />
          </label>
          <button class="journal-sort" type="button" data-journal-sort aria-label="Change article order">Newest first</button>
        </div>
      </header>

      <section class="journal-stage" data-journal-stage aria-label="Journal articles">
        <div class="journal-index" data-journal-index>
          <svg class="journal-rail" data-journal-rail aria-hidden="true" preserveAspectRatio="none">
            <defs>
              <linearGradient id="railStroke" data-rail-gradient gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-opacity="1" data-rail-edge-stop />
                <stop offset="0.06" stop-opacity="1" />
                <stop offset="0.94" stop-opacity="1" />
                <stop offset="1" stop-opacity="1" data-rail-edge-stop />
              </linearGradient>
            </defs>
            <path data-journal-path />
            <path class="journal-rail-shape" data-journal-shape />
          </svg>
          <div class="journal-list" data-journal-list><!-- ssr:journal-list --></div>
          <p class="journal-empty" data-journal-empty hidden>No articles found.</p>
        </div>

        <aside class="article-preview" data-article-preview aria-live="polite" hidden>
          <a class="article-preview-link" data-preview-link href="#">
            <header class="article-preview-header">
              <h2 data-preview-title></h2>
              <time data-preview-date></time>
            </header>
            <div class="article-preview-document" data-preview-document></div>
          </a>
        </aside>
      </section>
    </main>

    <script type="module" src="/scripts/journal.js"></script>
  </body>
</html>
