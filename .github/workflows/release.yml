name: Release Laboratory

on:
  push:
    tags:
      - "laboratory-v*"

permissions:
  contents: read

env:
  UPDATER_REPOSITORY: ${{ vars.UPDATER_REPOSITORY || 'psewdon1m-exocortex/updater' }}

concurrency:
  group: laboratory-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.candidate.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve and validate version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#laboratory-v}"
          [[ "$GITHUB_REF_NAME" == "laboratory-v${version}" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$(node -p "require('./services/api/package.json').version")" == "$version" ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download current-revision policy evidence
        uses: actions/download-artifact@v4
        with:
          name: laboratory-policy-${{ github.sha }}
      - name: Verify tag targets current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Download and verify pinned Updater
        env:
          GH_TOKEN: ${{ secrets.RELEASE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          mkdir -p .release-inputs
          gh release download "updater-v${updater_version}" \
            --repo "$UPDATER_REPOSITORY" --dir .release-inputs \
            --pattern "updater-${updater_version}-install.tar.gz" \
            --pattern "updater-${updater_version}-install.tar.gz.sha256" \
            --pattern "updater-release.json" --pattern "updater-release.json.sig.json"
          python3 scripts/verify-release-manifest.py .release-inputs/updater-release.json .release-inputs/updater-release.json.sig.json .release/updater-public-key.pem
          python3 scripts/verify-updater-bundle.py .release-inputs "$updater_version"
          (cd .release-inputs && sha256sum -c "updater-${updater_version}-install.tar.gz.sha256")
          printf '%s  %s\n' "$(tr -d '[:space:]' < .release/updater.sha256)" "updater-${updater_version}-install.tar.gz" > .release-inputs/updater-pinned.sha256
          (cd .release-inputs && sha256sum -c updater-pinned.sha256)
          tar -xzf ".release-inputs/updater-${updater_version}-install.tar.gz" -C .release-inputs
          wyvern_version="$(tr -d '[:space:]' < .release/wyvern.version)"
          mkdir -p .release-inputs/wyvern
          gh release download "wyvern-v${wyvern_version}" --repo psewdon1m-exocortex/wyvern --dir .release-inputs/wyvern --pattern wyvern-release.json --pattern wyvern-release.json.sig.json
          python3 scripts/verify-wyvern-bundle.py .release-inputs/wyvern .release-inputs/updater/release-trust/wyvern.pem

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate once
        id: candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.release.outputs.image }}:candidate-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Smoke-test the exact published digest
        shell: bash
        env:
          IMAGE: ${{ steps.release.outputs.image }}@${{ steps.candidate.outputs.digest }}
        run: |
          set -euo pipefail
          name="laboratory-release-${GITHUB_RUN_ID}"
          volume="laboratory-release-${GITHUB_RUN_ID}"
          docker pull "$IMAGE"
          docker volume create "$volume" >/dev/null
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$name" --read-only --init --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m \
            --mount "type=volume,source=$volume,target=/app/data" -p 127.0.0.1::18380 \
            -e LABORATORY_ACCESS_KEY=release-test-access-key-32-characters \
            -e LABORATORY_SESSION_SECRET=release-test-session-secret-32-characters \
            -e LABORATORY_COOKIE_SECURE=true \
            -e LABORATORY_PUBLIC_URL=https://laboratory.example.test \
            -e LABORATORY_AI_PIPELINE_ENABLED=0 "$IMAGE"
          port=$(docker inspect --format '{{(index (index .NetworkSettings.Ports "18380/tcp") 0).HostPort}}' "$name")
          for _ in {1..45}; do
            curl -fsS --max-time 2 "http://127.0.0.1:$port/api/health" >/dev/null && break
            if [ "$(docker inspect --format '{{.State.Status}}' "$name")" = exited ]; then docker logs "$name"; exit 1; fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:$port/about" | grep -q '<main'

      - name: Qualify all pre-signing checks before granting signing access
        run: |
          python3 scripts/known-problems-gate.py --record helper-contract --command python3 scripts/verify-updater-bundle.py .release-inputs "$(cat .release/updater.version)"
          python3 scripts/known-problems-gate.py --phase pre-signing
      - name: Preserve unsigned candidate inputs and qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laboratory-prepared-${{ github.sha }}
          path: |
            .release-inputs/
            .release-evidence/
            known-problems-report.json
          include-hidden-files: true
          if-no-files-found: error

  signing:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: actions/download-artifact@v4
        with:
          name: laboratory-prepared-${{ github.sha }}
      - name: Revalidate pre-signing receipts
        run: python3 scripts/known-problems-gate.py --phase pre-signing
      - name: Export release public key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs --export-public-key release-artifacts/laboratory.pem

      - name: Build and verify release artifacts
        env:
          IMAGE_REFERENCE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.prepare.outputs.digest }}
        run: |
          updater_version="$(tr -d '[:space:]' < .release/updater.version)"
          UPDATER_BUNDLE_DIR="$PWD/.release-inputs/updater" \
          WYVERN_BUNDLE_DIR="$PWD/.release-inputs/wyvern" \
          UPDATER_BUNDLE_VERSION="$updater_version" \
            bash scripts/build-release.sh "${{ needs.prepare.outputs.version }}"
          node scripts/verify-release.mjs release-artifacts/laboratory-release.json
          (cd release-artifacts && sha256sum -c "laboratory-${{ needs.prepare.outputs.version }}-compose.tar.gz.sha256")

      - name: Sign and verify final release assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          node scripts/sign-release.mjs release-artifacts/laboratory-release.json
          python3 scripts/verify-release-manifest.py release-artifacts/laboratory-release.json release-artifacts/laboratory-release.json.sig.json release-artifacts/laboratory.pem
          sh -n release-artifacts/bootstrap.sh
          if grep -q '__HEAD_BOOTSTRAP_' release-artifacts/bootstrap.sh; then exit 1; fi

      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "release-artifacts/*"

      - name: Stage immutable candidate assets without final discovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --prerelease --latest=false --generate-notes --title "laboratory ${{ needs.prepare.outputs.version }}"
      - name: Verify anonymous published assets and final trust
        run: |
          python3 scripts/known-problems-gate.py --record published-assets --command python3 scripts/verify-published-assets.py release-artifacts
          python3 scripts/known-problems-gate.py --phase final
          cp known-problems-report.json release-artifacts/known-problems-report.json
      - name: Attach final qualification evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-artifacts/known-problems-report.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the already tested digest
        run: |
          docker buildx imagetools create --tag "${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.image }}@${{ needs.prepare.outputs.digest }}"
          test "$(docker buildx imagetools inspect '${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}' --format '{{.Manifest.Digest}}')" = '${{ needs.prepare.outputs.digest }}'
      - name: Enable final service-qualified discovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest=false
      - name: Preserve gate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: laboratory-final-evidence-${{ github.sha }}
          path: |
            .release-evidence/
            known-problems-report.json
          include-hidden-files: true
