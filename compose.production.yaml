name: laboratory

services:
  laboratory:
    image: "${LABORATORY_IMAGE:?Set LABORATORY_IMAGE in .env}"
    container_name: exocortex-laboratory
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LABORATORY_LISTEN_PORT:-18380}:${LABORATORY_LISTEN_PORT:-18380}"
    environment:
      NODE_ENV: production
      LABORATORY_LISTEN_PORT: "${LABORATORY_LISTEN_PORT:-18380}"
      LABORATORY_VERSION: "${LABORATORY_VERSION:-0.1.0}"
      LABORATORY_DATA_DIR: /app/data
      LABORATORY_ADMIN_USERNAME: "${LABORATORY_ADMIN_USERNAME:?Set LABORATORY_ADMIN_USERNAME in .env}"
      LABORATORY_ADMIN_PASSWORD: "${LABORATORY_ADMIN_PASSWORD:?Set LABORATORY_ADMIN_PASSWORD in .env}"
      LABORATORY_SESSION_SECRET: "${LABORATORY_SESSION_SECRET:?Set LABORATORY_SESSION_SECRET in .env}"
      LABORATORY_COOKIE_SECURE: "${LABORATORY_COOKIE_SECURE:-true}"
      LABORATORY_TRUST_PROXY: "${LABORATORY_TRUST_PROXY:-true}"
      LABORATORY_CONTENT_GITHUB_TOKEN: "${LABORATORY_CONTENT_GITHUB_TOKEN:?Set LABORATORY_CONTENT_GITHUB_TOKEN in .env}"
      LABORATORY_CONTENT_WEBHOOK_SECRET: "${LABORATORY_CONTENT_WEBHOOK_SECRET:?Set LABORATORY_CONTENT_WEBHOOK_SECRET in .env}"
      LABORATORY_GITHUB_TIMEOUT_SEC: "${LABORATORY_GITHUB_TIMEOUT_SEC:-15}"
      LABORATORY_DEFAULT_LANGUAGE: "${LABORATORY_DEFAULT_LANGUAGE:-en}"
      LABORATORY_DEFAULT_AUTHOR_NAME: "${LABORATORY_DEFAULT_AUTHOR_NAME:-c31e1b26}"
      LABORATORY_AI_PIPELINE_ENABLED: "${LABORATORY_AI_PIPELINE_ENABLED:-1}"
      LABORATORY_GEMINI_MODEL: "${LABORATORY_GEMINI_MODEL:-gemini-2.5-flash}"
      LABORATORY_GEMINI_MAX_OUTPUT_TOKENS: "${LABORATORY_GEMINI_MAX_OUTPUT_TOKENS:-8192}"
      LABORATORY_GEMINI_THINKING_BUDGET: "${LABORATORY_GEMINI_THINKING_BUDGET:-0}"
      LABORATORY_DERIVED_CONTENT_INTERVAL_SEC: "${LABORATORY_DERIVED_CONTENT_INTERVAL_SEC:-15}"
      LABORATORY_DERIVED_CONTENT_MAX_ATTEMPTS: "${LABORATORY_DERIVED_CONTENT_MAX_ATTEMPTS:-3}"
      LABORATORY_INDEXNOW_ENABLED: "${LABORATORY_INDEXNOW_ENABLED:-false}"
      LABORATORY_INDEXNOW_KEY: "${LABORATORY_INDEXNOW_KEY:-}"
      LABORATORY_INDEXNOW_ENDPOINT: "${LABORATORY_INDEXNOW_ENDPOINT:-https://api.indexnow.org/indexnow}"
      LABORATORY_GOOGLE_INDEXING_EXPERIMENT_ENABLED: "${LABORATORY_GOOGLE_INDEXING_EXPERIMENT_ENABLED:-false}"
      LABORATORY_GOOGLE_INDEXING_EXPERIMENT_END_DATE: "${LABORATORY_GOOGLE_INDEXING_EXPERIMENT_END_DATE:-}"
      LABORATORY_GOOGLE_INDEXING_EXPERIMENT_MAX_URLS_PER_DAY: "${LABORATORY_GOOGLE_INDEXING_EXPERIMENT_MAX_URLS_PER_DAY:-1}"
      LABORATORY_GOOGLE_INDEXING_EXPERIMENT_SAMPLE_PERCENT: "${LABORATORY_GOOGLE_INDEXING_EXPERIMENT_SAMPLE_PERCENT:-50}"
      LABORATORY_GOOGLE_SERVICE_ACCOUNT_BASE64: "${LABORATORY_GOOGLE_SERVICE_ACCOUNT_BASE64:-}"
      LABORATORY_SEARCH_NOTIFICATION_INTERVAL_SEC: "${LABORATORY_SEARCH_NOTIFICATION_INTERVAL_SEC:-30}"
      LABORATORY_SEARCH_NOTIFICATION_TIMEOUT_SEC: "${LABORATORY_SEARCH_NOTIFICATION_TIMEOUT_SEC:-15}"
      LABORATORY_PUBLIC_API_RATE_LIMIT: "${LABORATORY_PUBLIC_API_RATE_LIMIT:-120}"
      LABORATORY_MCP_RATE_LIMIT: "${LABORATORY_MCP_RATE_LIMIT:-60}"
      KERNEL_URL: "${KERNEL_URL:?Set KERNEL_URL in .env}"
      KERNEL_SERVICE_TOKEN: "${KERNEL_SERVICE_TOKEN:?Set KERNEL_SERVICE_TOKEN in .env}"
      KERNEL_CACHE_PATH: /app/data/kernel-cache/register.snapshot.json
      KERNEL_TIMEOUT_SEC: "${KERNEL_TIMEOUT_SEC:-3}"
      KERNEL_REFRESH_SEC: "${KERNEL_REFRESH_SEC:-60}"
      UPDATER_SOCKET_PATH: /run/exocortex/updater.sock
      UPDATER_HEAD_ID: "${UPDATER_HEAD_ID:-laboratory}"
      UPDATER_CONTROL_TOKEN: "${UPDATER_CONTROL_TOKEN:?Set UPDATER_CONTROL_TOKEN in .env}"
    volumes:
      - laboratory-data:/app/data
      - type: bind
        source: "${UPDATER_SOCKET_DIR:-/run/exocortex}"
        target: /run/exocortex
        read_only: true
    group_add:
      - "${UPDATER_SOCKET_GID:?Set UPDATER_SOCKET_GID during VPS installation}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: "${LABORATORY_MEMORY_LIMIT:-1g}"
    cpus: "${LABORATORY_CPU_LIMIT:-2.0}"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  laboratory-data:
